    <main> 
        <h2>Feedback</h2>
        <h3> Have a recommendation or critique? Leave a comment!</h3>
        <p>Required fields are marked with an asterisk *</p>
        <form method="post" action="https://webdevbasics.net/scripts/pacific.php">
            <label for="myFName">*First Name:</label>
             <input type="text"
                id="myFName"
                name="myFName"
                required>
             <label for="myLName">* Last Name</label>
             <input type="text"
                id="myLName"
                name="myLName"
                required>
            <label for="myEmail">* E-mail</label>
            <input type="email"
                id="myEmail"
                name="myEmail"
                required>
            <label for="myComments">*Comments:</label>
            <textarea name="myComments" 
                id="myComments" 
                rows="2" 
                cols="30"
                required></textarea>
            <input type="submit">
        </form>
    </main>
